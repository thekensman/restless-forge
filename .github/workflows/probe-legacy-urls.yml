name: Probe legacy URLs (temporary)

# One-off, read-only check of production, run from a GitHub runner (the
# development sandbox cannot reach restless-forge.dev). It records the FIRST
# response for every legacy URL: a tool that follows redirects shows the
# article either way, so only the status line and Location header prove
# whether a URL redirects or serves a duplicate. Delete after use.
on:
  push:
    branches: [claude/rf-hav-discovery-improvements-er83dr]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: First response for every legacy URL, as a browser and as curl
        run: |
          S=https://restless-forge.dev
          UA_BROWSER='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0 Mobile Safari/537.36'
          slugs="best-hologram-projectors best-images-for-holograms colour-theory-holographic-art
            creating-hologram-art diy-hologram-pyramid future-of-holographic-displays
            gif-vs-video-hologram history-of-holograms hologram-displays-for-business
            hologram-effects-explained holograms-in-pop-culture how-hologram-pyramids-work
            led-hologram-fans optimizing-hologram-output peppers-ghost-illusion"

          # from|expected Location (every URL here must be a single 301)
          pairs=""
          for s in $slugs; do
            pairs="$pairs $S/tools/holopath/articles/$s.html|$S/tools/holopath/articles/$s"
            pairs="$pairs $S/articles/$s|$S/tools/holopath/articles/$s"
          done
          for p in about faq how-it-works; do pairs="$pairs $S/tools/holopath/$p.html|$S/tools/holopath/$p/"; done
          for p in contact privacy terms; do pairs="$pairs $S/tools/holopath/$p.html|$S/$p"; done
          pairs="$pairs $S/about.html|$S/about $S/index.html|$S/ $S/tools/holopath/index.html|$S/tools/holopath/"
          pairs="$pairs $S/tools/holopath/articles/index.html|$S/tools/holopath/articles/"

          first() {  # first <url> <user-agent>: status, Location, Cloudflare cache status and colo
            curl -s -o /dev/null -D - --max-time 20 -A "$2" "$1" | tr -d '\r' | awk '
              NR==1 { st=$2 }
              tolower($1)=="location:" { loc=$2 }
              tolower($1)=="cf-cache-status:" { cf=$2 }
              tolower($1)=="cf-ray:" { n=split($2,a,"-"); colo=a[n] }
              END { printf "%s|%s|%s|%s", st, loc, (cf==""?"-":cf), colo }'
          }

          ok=0; bad=0
          for ua_name in browser curl; do
            ua=$UA_BROWSER; [ "$ua_name" = curl ] && ua="curl/8"
            echo "── as $ua_name ──"
            for pair in $pairs; do
              from=${pair%%|*}; want=${pair#*|}
              IFS='|' read -r st loc cf colo <<<"$(first "$from" "$ua")"
              if [ "$st" = 301 ] && [ "$loc" = "$want" ]; then
                final=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -A "$ua" "$want")
                if [ "$final" = 200 ]; then ok=$((ok+1)); verdict=OK; else bad=$((bad+1)); verdict="TARGET $final"; fi
              else
                bad=$((bad+1)); verdict=WRONG
              fi
              printf '%-6s %s %s -> %s  [cf-cache-status %s, colo %s]\n' "$verdict" "$st" "${from#$S}" "${loc#$S}" "$cf" "$colo"
            done
          done
          echo "── $ok single-hop 301s to the canonical URL, $bad problems ──"
          [ "$bad" -eq 0 ]

      - name: Full headers for two URLs, for the record
        if: always()
        run: |
          for u in https://restless-forge.dev/tools/holopath/articles/optimizing-hologram-output.html \
                   https://restless-forge.dev/tools/holopath/articles/optimizing-hologram-output; do
            echo "── GET $u"
            curl -s -o /dev/null -D - --max-time 20 "$u" | tr -d '\r' \
              | grep -i -E '^(HTTP/|location:|cache-control:|cf-cache-status:|cf-ray:|server:|content-type:)'
          done
