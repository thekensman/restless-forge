name: Annual data freshness check

# Safety net for the yearly data refresh: verifies every rate-dependent
# dataset in the repo actually got updated for the current year, and opens
# a GitHub issue if anything is stale. This catches the silent-failure mode
# where the annual refresh job dies without delivering (as happened with
# the 2026 WIMTW tax update).
#
# It runs two weeks after the refresh is due (Jan 20), and can be run
# manually from the Actions tab at any time.

on:
  schedule:
    - cron: "0 12 20 1 *"   # Jan 20, 12:00 UTC, yearly
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check dataset years
        id: check
        run: |
          python3 - <<'PY' > stale_report.md || true
          import json, re, datetime, sys

          year = datetime.date.today().year
          stale = []

          def expect(cond, label, detail):
              if not cond:
                  stale.append(f"- **{label}** — {detail}")

          # WIMTW federal tax constants (engine.ts carries a "Tax year YYYY" marker)
          s = open("tools/what-is-my-time-worth/frontend/src/engine.ts").read()
          m = re.search(r"Tax year (\d{4})", s)
          expect(m and int(m.group(1)) == year, "WIMTW tax constants",
                 f"engine.ts marker says {m.group(1) if m else 'none'}, expected {year}")

          # IRS mileage rate JSON
          j = json.load(open("scripts/maintenance/data/mileage_rate.json"))
          expect(j.get("current_year") == year, "IRS mileage rate",
                 f"mileage_rate.json current_year={j.get('current_year')}, expected {year}")

          # Side Hustle Reality hard-coded rate must match the JSON
          s = open("tools/side-hustle-reality/frontend/src/index.html").read()
          m = re.search(r"IRS_MILE = ([0-9.]+)", s)
          expect(m and float(m.group(1)) == j.get("current_rate"), "Side Hustle Reality mileage",
                 f"IRS_MILE={m.group(1) if m else 'none'} vs JSON {j.get('current_rate')}")

          # Is My Raise Real CPI table must include last year's annual average
          s = open("tools/is-my-raise-real/frontend/src/index.html").read()
          expect(re.search(rf"{year - 1}\s*:", s), "CPI table",
                 f"is-my-raise-real has no {year - 1} CPI entry")

          if stale:
              print(f"## Annual data refresh incomplete for {year}\n")
              print("\n".join(stale))
              print("\nRun the annual data refresh (see docs/automation.md) and update the entries above.")
              sys.exit(1)
          PY
          if [ -s stale_report.md ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "All datasets current."
          fi

      - name: Open issue if stale
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Annual data refresh incomplete ($(date +%Y))" \
            --body-file stale_report.md
