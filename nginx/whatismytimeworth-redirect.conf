# ═══════════════════════════════════════════════════
# What Is My Time Worth — 301 Redirect
# (whatismytimeworth.app → restless-forge.dev)
# ═══════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name whatismytimeworth.app www.whatismytimeworth.app;
    return 301 https://restless-forge.dev/tools/what-is-my-time-worth$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name whatismytimeworth.app www.whatismytimeworth.app;

    ssl_certificate     /etc/letsencrypt/live/whatismytimeworth.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whatismytimeworth.app/privkey.pem;

    # Redirect root to tool page
    location = / {
        return 301 https://restless-forge.dev/tools/what-is-my-time-worth/;
    }

    # Redirect all other paths preserving the path
    location / {
        return 301 https://restless-forge.dev/tools/what-is-my-time-worth$request_uri;
    }
}
