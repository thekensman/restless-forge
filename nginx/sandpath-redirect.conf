# ═══════════════════════════════════════════════════
# SandPath — 301 Redirect (sandpath.art → restless-forge.dev)
# ═══════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name sandpath.art www.sandpath.art;
    return 301 https://restless-forge.dev/tools/sandpath$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sandpath.art www.sandpath.art;

    ssl_certificate     /etc/letsencrypt/live/sandpath.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sandpath.art/privkey.pem;

    # Redirect root to tool page
    location = / {
        return 301 https://restless-forge.dev/tools/sandpath/;
    }

    # Redirect all other paths preserving the path
    location / {
        return 301 https://restless-forge.dev/tools/sandpath$request_uri;
    }
}
