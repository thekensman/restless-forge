# ═══════════════════════════════════════════════════
# HoloPath — 301 Redirect (holopath.art → restless-forge.dev)
# ═══════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name holopath.art www.holopath.art;
    return 301 https://restless-forge.dev/tools/holopath$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name holopath.art www.holopath.art;

    ssl_certificate     /etc/letsencrypt/live/holopath.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/holopath.art/privkey.pem;

    # Redirect root to tool page
    location = / {
        return 301 https://restless-forge.dev/tools/holopath/;
    }

    # Redirect all other paths preserving the path
    location / {
        return 301 https://restless-forge.dev/tools/holopath$request_uri;
    }
}
