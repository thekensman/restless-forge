# ═══════════════════════════════════════════════════
# Restless Forge — Main Site (restless-forge.dev)
# ═══════════════════════════════════════════════════

# ── API rate limit zone (http context — this file is included from
#    sites-enabled inside the distro nginx.conf's http{} block) ──
# Keyed on Cloudflare's CF-Connecting-IP header, NOT $binary_remote_addr:
# the droplet only admits Cloudflare edge IPs, so the binary address would
# rate-limit the edges collectively instead of individual visitors. An empty
# key (request not via Cloudflare) is exempt from the limit, which is fine —
# the firewall only admits Cloudflare on 80/443 anyway.
limit_req_zone $http_cf_connecting_ip zone=rf_api:10m rate=10r/m;

# Song-status polling needs its own, much looser zone. A browser waiting on a
# sung song polls every 5 seconds, i.e. 12 r/m — which the 10r/m rf_api zone
# would start rejecting partway through the FIRST song. The endpoint is a
# single indexed SELECT plus one upstream status check, so it is cheap enough
# to allow at this rate.
limit_req_zone $http_cf_connecting_ip zone=rf_poll:10m rate=60r/m;

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name restless-forge.dev www.restless-forge.dev;
    return 301 https://restless-forge.dev$request_uri;
}

# www → apex redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.restless-forge.dev;

    ssl_certificate     /etc/letsencrypt/live/restless-forge.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restless-forge.dev/privkey.pem;

    return 301 https://restless-forge.dev$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name restless-forge.dev;

    root /var/www/restless-forge;
    index index.html;

    # ── SSL ──
    ssl_certificate     /etc/letsencrypt/live/restless-forge.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restless-forge.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;

    server_tokens off;

    # ── Security Headers ──
    # GOTCHA: nginx `add_header` in a location block REPLACES all headers
    # inherited from the server level. Every location below that sets a
    # Cache-Control header must therefore repeat this whole block, or its
    # responses silently lose HSTS & friends. (Single-file vhost by design —
    # the deploy pipeline ships exactly this file — so the headers are
    # repeated inline rather than via an include snippet.)
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy     "camera=(self), microphone=(), geolocation=(), payment=()" always;

    # ── Gzip Compression ──
    gzip on;
    # (text/html is gzipped by default — listing it here triggers a
    #  "duplicate MIME type" warning on nginx -t)
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_comp_level 6;

    # ── Generated song audio (Rise & Rhyme v2) ──
    # Served straight off disk rather than through FastAPI so that nginx
    # handles Range requests: Safari and iOS issue them for <audio> and can
    # refuse to play a source that only ever answers 200.
    #
    # Longest-prefix wins among prefix locations, so this beats the ^~ /api/
    # block below. Files are written by the API into a path only it can write
    # (systemd ReadWritePaths); nginx only reads.
    #
    # KEEP BOTH TRAILING SLASHES. `location ^~ /…/song/` + `alias …/song-cache/`
    # is the safe form; dropping the slash from the location turns this into
    # the classic alias path-traversal bug.
    location ^~ /api/v1/rise-and-rhyme/song/ {
        alias /var/lib/restless-forge/song-cache/;
        limit_req zone=rf_poll burst=10 nodelay;
        # Filenames are unguessable tokens, and the audio sings the listener's
        # schedule aloud. `private` keeps it out of Cloudflare and any other
        # shared cache while still letting the listener's own browser hold it,
        # which is what makes the alarm survive a flaky morning connection.
        add_header Cache-Control "private, max-age=86400" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy     "camera=(self), microphone=(), geolocation=(), payment=()" always;
    }

    # ── Song-status polling ──
    # Split out for the looser rf_poll zone only; otherwise identical to the
    # /api/ block. Note the path is /song-status/, NOT /song/…/status: that
    # would fall inside the static alias above and never reach the API.
    location ^~ /api/v1/rise-and-rhyme/song-status/ {
        limit_req zone=rf_poll burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy     "camera=(self), microphone=(), geolocation=(), payment=()" always;
    }

    # ── Backend API (cloud-assisted tools) ──
    # ^~ prefix match BEATS the regex locations below — without it,
    # /api/v1/... would be swallowed by the \.html$/static regexes.
    location ^~ /api/ {
        limit_req zone=rf_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 60s;  # Claude generation can take tens of seconds
        client_max_body_size 64k;
        add_header Cache-Control "no-store" always;
        # security headers (repeated — see the add_header gotcha above)
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy     "camera=(self), microphone=(), geolocation=(), payment=()" always;
    }

    # ═══ Regex-location ORDER MATTERS: nginx uses the FIRST matching regex.
    #     Brand assets and the tool fallback MUST come before the generic
    #     1-year static block, or they inherit its immutable cache / never
    #     fire at all. ═══

    # ── Brand/identity assets: SHORT cache ──
    # Browsers request /favicon.ico directly (no query string possible), so
    # these can never be cache-busted. A 1-year immutable cache here once
    # made a favicon swap invisible for up to a year.
    location ~* ^/(favicon\.(?:svg|ico)|apple-touch-icon\.png|site\.webmanifest|og-image\.png)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        # security headers (repeated — see the add_header gotcha above)
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy     "camera=(self), microphone=(), geolocation=(), payment=()" always;
    }

    # ── Per-tool asset fallback to site root (SHORT cache, same reason) ──
    # Lets tools omit favicon/manifest/og-image files; nginx serves the
    # site-wide version for any tool that doesn't ship its own.
    location ~* ^/tools/[^/]+/(favicon\.(?:svg|ico)|apple-touch-icon\.png|site\.webmanifest|og-image\.png)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        # security headers (repeated — see the add_header gotcha above)
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy     "camera=(self), microphone=(), geolocation=(), payment=()" always;
        try_files $uri /$1 =404;
    }

    # ── Cache: Static Assets (1 year) ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # security headers (repeated — see the add_header gotcha above)
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy     "camera=(self), microphone=(), geolocation=(), payment=()" always;
    }

    # ── Cache: HTML (no-cache for freshness) ──
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # security headers (repeated — see the add_header gotcha above)
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy     "camera=(self), microphone=(), geolocation=(), payment=()" always;
    }

    # ── Retired per-tool legal/contact pages → site-global equivalents ──
    # Client-side tools no longer ship their own privacy/terms/contact; those
    # live once at /privacy, /terms, /contact. Cloud-assisted tools (tier:
    # 'cloud', e.g. rise-and-rhyme) DO keep a per-tool privacy page describing
    # their server-side data flow, so they are deliberately excluded here.
    # Regex locations are matched before prefix locations, so this wins over
    # `location /tools/` below.
    location ~ ^/tools/(what-is-my-time-worth|holopath|tattoosafe)/(privacy|terms|contact)/?$ {
        return 301 /$2;
    }

    # ── Tools: Serve static files ──
    location /tools/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # ── Global pages: .html extension optional ──
    location / {
        try_files $uri $uri.html $uri/ $uri/index.html =404;
    }

    # ── ads.txt ──
    location = /ads.txt {
        default_type text/plain;
    }

    # ── Deny hidden files ──
    location ~ /\. {
        deny all;
    }
}
