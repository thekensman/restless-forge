# ═══════════════════════════════════════════════════
# Restless Forge — Main Site (restless-forge.dev)
# ═══════════════════════════════════════════════════

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name restless-forge.dev www.restless-forge.dev;
    return 301 https://restless-forge.dev$request_uri;
}

# www → apex redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.restless-forge.dev;

    ssl_certificate     /etc/letsencrypt/live/restless-forge.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restless-forge.dev/privkey.pem;

    return 301 https://restless-forge.dev$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name restless-forge.dev;

    root /var/www/restless-forge;
    index index.html;

    # ── SSL ──
    ssl_certificate     /etc/letsencrypt/live/restless-forge.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restless-forge.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Security Headers ──
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Gzip Compression ──
    gzip on;
    gzip_types text/html text/plain text/css application/json application/javascript image/svg+xml;
    gzip_comp_level 6;

    # ── Cache: Static Assets (1 year) ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Cache: HTML (no-cache for freshness) ──
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Per-tool asset fallback to site root ──
    # Lets tools omit favicon/manifest/og-image files; nginx serves the
    # site-wide version for any tool that doesn't ship its own. The regex
    # location takes priority over the generic `/tools/` prefix below.
    location ~* ^/tools/[^/]+/(favicon\.(?:svg|ico)|apple-touch-icon\.png|site\.webmanifest|og-image\.png)$ {
        try_files $uri /$1 =404;
    }

    # ── Tools: Serve static files ──
    location /tools/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # ── Global pages: .html extension optional ──
    location / {
        try_files $uri $uri.html $uri/ $uri/index.html =404;
    }

    # ── ads.txt ──
    location = /ads.txt {
        default_type text/plain;
    }

    # ── Deny hidden files ──
    location ~ /\. {
        deny all;
    }
}
