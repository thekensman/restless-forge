# ═══════════════════════════════════════════════════
# Restless Forge — Main Site (restless-forge.dev)
# ═══════════════════════════════════════════════════

# ── API rate limit zone (http context — this file is included from
#    sites-enabled inside the distro nginx.conf's http{} block) ──
# Keyed on Cloudflare's CF-Connecting-IP header, NOT $binary_remote_addr:
# the droplet only admits Cloudflare edge IPs, so the binary address would
# rate-limit the edges collectively instead of individual visitors. An empty
# key (request not via Cloudflare) is exempt from the limit, which is fine —
# the firewall only admits Cloudflare on 80/443 anyway.
limit_req_zone $http_cf_connecting_ip zone=rf_api:10m rate=10r/m;

# ═══ One URL per page (http context, same reason as above) ═══
# Every page has exactly one URL: the one its rel=canonical names and
# sitemap.xml lists. Any other spelling of it 301s there in ONE hop, and a URL
# with nothing behind it stays a plain 404. The main server applies the maps
# below before any location runs. Policy, evidence and the legacy-URL history:
# docs/indexing.md. `npm run check-urls` runs this file under a real nginx in
# CI and fails the build if any of it stops holding.

# Retired URLs with a known replacement. Keyed on $uri (decoded, no query).
# Add a line only with evidence that the old URL was real (git history, Search
# Console) AND that its replacement is the same content. A merely similar page
# does not count, and neither does the homepage. check-urls fails if a line here
# ever shadows a real page.
map $uri $rf_legacy_target {
    default "";

    # HoloPath's own articles index linked /articles/<slug> (a holopath.art-era
    # path) until 2026-08-06, so Google still holds these root-level URLs.
    "~^/articles/(?<rf_legacy>best-hologram-projectors|best-images-for-holograms|colour-theory-holographic-art|creating-hologram-art|diy-hologram-pyramid|future-of-holographic-displays|gif-vs-video-hologram|history-of-holograms|hologram-displays-for-business|hologram-effects-explained|holograms-in-pop-culture|how-hologram-pyramids-work|led-hologram-fans|optimizing-hologram-output|peppers-ghost-illusion)$"
        /tools/holopath/articles/$rf_legacy;

    # HoloPath sub-pages were <page>.html from the 2026-03 consolidation until
    # they became directories on 2026-05-08.
    "~^/tools/holopath/(?<rf_legacy>about|faq|how-it-works)\.html$"
        /tools/holopath/$rf_legacy/;

    # Client-side tools' own legal/contact pages, retired for the site-global
    # ones on 2026-08-04. Cloud-assisted tools (tier: 'cloud') keep a per-tool
    # privacy page for their server-side data flow, so they are not listed.
    "~^/tools/(?:what-is-my-time-worth|holopath|tattoosafe)/(?<rf_legacy>privacy|terms|contact)(?:/|/index\.html|\.html)?$"
        /$rf_legacy;

    # What Is My Time Worth's blog/ became articles/ on 2026-03-16, and the
    # whatismytimeworth.app vhost still forwards /blog/... here path-for-path.
    "~^/tools/what-is-my-time-worth/blog(?:/|/index\.html)?$"
        /tools/what-is-my-time-worth/articles/;
    "~^/tools/what-is-my-time-worth/blog/(?<rf_legacy>life-energy-and-ymoyl)(?:/|/index\.html)?$"
        /tools/what-is-my-time-worth/articles/$rf_legacy/;
}

# The .html spelling of a page → that page's canonical URL:
#   /about.html → /about      /tools/holopath/about/index.html → /tools/holopath/about/
# Until this existed, every .html URL served the page again with a 200, so
# Google held two URLs per page, and where it inspected both (e.g.
# optimizing-hologram-output) it chose the .html one as canonical.
#
# Keyed on $request_uri (what the client literally sent), NEVER $uri: the index
# module's internal hop from /dir/ to /dir/index.html rewrites $uri but not
# $request_uri, so a $uri test would redirect every directory page to itself.
# Segments are limited to [A-Za-z0-9._~-] and must start alphanumeric, which
# keeps "//host" (an open redirect), "..", and percent-escapes (CRLF header
# injection via the decoded form) out of the Location header by construction.
map $request_uri $rf_html_file {
    default "";
    "~^(?<rf_html_f>/(?:[A-Za-z0-9][A-Za-z0-9._~-]*/)*[A-Za-z0-9][A-Za-z0-9._~-]*\.html)(?:\?.*)?$"
        $rf_html_f;
}
map $request_uri $rf_html_canonical {
    default "";
    "~^(?<rf_html_c>/(?:[A-Za-z0-9][A-Za-z0-9._~-]*/)*)index\.html(?:\?.*)?$"
        $rf_html_c;
    "~^(?<rf_html_c>/(?:[A-Za-z0-9][A-Za-z0-9._~-]*/)*[A-Za-z0-9][A-Za-z0-9._~-]*)\.html(?:\?.*)?$"
        $rf_html_c;
}

# HTML must revalidate on every view (docs/frontend-pitfalls.md §1) at EVERY
# URL that serves it. The \.html$ location below used to be the only place that
# said so, but try_files $uri.html serves /about, essays and HoloPath articles
# straight from the prefix locations, which never pass through it. Those
# canonical URLs went out with no Cache-Control at all, so browsers cached them
# heuristically.
map $sent_http_content_type $rf_html_expires {
    default       off;
    "~^text/html" -1;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name restless-forge.dev www.restless-forge.dev;
    return 301 https://restless-forge.dev$request_uri;
}

# www → apex redirect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.restless-forge.dev;

    ssl_certificate     /etc/letsencrypt/live/restless-forge.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restless-forge.dev/privkey.pem;

    return 301 https://restless-forge.dev$request_uri;
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name restless-forge.dev;

    root /var/www/restless-forge;
    index index.html;

    # ── SSL ──
    ssl_certificate     /etc/letsencrypt/live/restless-forge.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/restless-forge.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;

    server_tokens off;

    # ── One URL per page (maps at the top of this file) ──
    # Server-level `if` + `return` runs before location matching, so these win
    # over every location below, the regex ones included. Absolute targets, so
    # the Location header never depends on the request's Host.
    if ($rf_legacy_target) {
        return 301 https://restless-forge.dev$rf_legacy_target$is_args$args;
    }
    # $rf_html_file is "" unless the client asked for a .html URL, and
    # -f on the bare document root (a directory) is false. So this only fires
    # when the named file really exists. A .html URL with nothing behind it
    # is left alone to 404.
    if (-f $document_root$rf_html_file) {
        return 301 https://restless-forge.dev$rf_html_canonical$is_args$args;
    }

    # HTML revalidates at every URL that serves it; other types are untouched
    # (map at the top of this file). Locations that set their own `expires`
    # override this.
    expires $rf_html_expires;

    # ── Security Headers ──
    # GOTCHA: nginx `add_header` in a location block REPLACES all headers
    # inherited from the server level. Every location below that sets a
    # Cache-Control header must therefore repeat this whole block, or its
    # responses silently lose HSTS & friends. (Single-file vhost by design —
    # the deploy pipeline ships exactly this file — so the headers are
    # repeated inline rather than via an include snippet.)
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy     "camera=(self), microphone=(), geolocation=(), payment=()" always;

    # ── Gzip Compression ──
    gzip on;
    # (text/html is gzipped by default — listing it here triggers a
    #  "duplicate MIME type" warning on nginx -t)
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_comp_level 6;

    # ── Backend API (cloud-assisted tools) ──
    # ^~ prefix match BEATS the regex locations below — without it,
    # /api/v1/... would be swallowed by the \.html$/static regexes.
    location ^~ /api/ {
        limit_req zone=rf_api burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 60s;  # Claude generation can take tens of seconds
        client_max_body_size 64k;
        add_header Cache-Control "no-store" always;
        # security headers (repeated — see the add_header gotcha above)
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy     "camera=(self), microphone=(), geolocation=(), payment=()" always;
    }

    # ═══ Regex-location ORDER MATTERS: nginx uses the FIRST matching regex.
    #     Brand assets and the tool fallback MUST come before the generic
    #     1-year static block, or they inherit its immutable cache / never
    #     fire at all. ═══

    # ── Brand/identity assets: SHORT cache ──
    # Browsers request /favicon.ico directly (no query string possible), so
    # these can never be cache-busted. A 1-year immutable cache here once
    # made a favicon swap invisible for up to a year.
    location ~* ^/(favicon\.(?:svg|ico)|apple-touch-icon\.png|site\.webmanifest|og-image\.png)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        # security headers (repeated — see the add_header gotcha above)
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy     "camera=(self), microphone=(), geolocation=(), payment=()" always;
    }

    # ── Per-tool asset fallback to site root (SHORT cache, same reason) ──
    # Lets tools omit favicon/manifest/og-image files; nginx serves the
    # site-wide version for any tool that doesn't ship its own.
    location ~* ^/tools/[^/]+/(favicon\.(?:svg|ico)|apple-touch-icon\.png|site\.webmanifest|og-image\.png)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        # security headers (repeated — see the add_header gotcha above)
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy     "camera=(self), microphone=(), geolocation=(), payment=()" always;
        try_files $uri /$1 =404;
    }

    # ── Cache: Static Assets (1 year) ──
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # security headers (repeated — see the add_header gotcha above)
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy     "camera=(self), microphone=(), geolocation=(), payment=()" always;
    }

    # ── Cache: HTML (no-cache for freshness) ──
    # No client request for a .html URL reaches this block any more (they 301
    # at the server level above, or 404). What lands here is the index module's
    # internal hop for directory pages: /tools/holopath/about/ is served as
    # /tools/holopath/about/index.html.
    location ~* \.html$ {
        # That hop only happens for a request path ending in "/". Anything else
        # here is a client asking for a .html file in a form the redirect above
        # refuses to build a Location from (dot segments, percent-escapes).
        # Nobody links to those, and serving them would mint a duplicate URL.
        if ($request_uri !~ "^[^?]*/(?:\?|$)") {
            return 404;
        }
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        # security headers (repeated — see the add_header gotcha above)
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy     "camera=(self), microphone=(), geolocation=(), payment=()" always;
    }

    # (Retired per-tool legal/contact pages used to 301 from a location here.
    # They are in the $rf_legacy_target table at the top of this file now,
    # together with their .html spellings, which this block's regex missed.)

    # ── Tools: Serve static files ──
    # $uri.html is NOT optional here. Every tool article's rel=canonical and
    # og:url is extensionless (/tools/<tool>/articles/<slug>), and without this
    # fallback each of those canonical URLs 404s — so every article told Google
    # its authoritative address was a dead page. The site root has always had
    # this fallback; /tools/ silently did not, and the asymmetry is invisible
    # until you request the canonical URL rather than the sitemap's.
    location /tools/ {
        try_files $uri $uri.html $uri/ $uri/index.html =404;
    }

    # ── Global pages: .html extension optional ──
    location / {
        try_files $uri $uri.html $uri/ $uri/index.html =404;
    }

    # ── ads.txt ──
    location = /ads.txt {
        default_type text/plain;
    }

    # ── Deny hidden files ──
    location ~ /\. {
        deny all;
    }
}
